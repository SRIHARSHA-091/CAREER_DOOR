spring.application.name=job-portal

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Configuration (replace jwt.secret in production with a private value of at least 32 characters)
jwt.secret=change-this-development-secret-to-a-minimum-32-character-value
jwt.expiration=3600000
jwt.refreshExpiration=604800000

# Email Configuration (Mock for development)
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Swagger Configuration
# Using defaults: /v3/api-docs and /swagger-ui/index.html

# Logging Configuration
logging.level.com.jobportal=DEBUG
logging.level.org.springframework.security=INFO
