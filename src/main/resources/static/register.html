<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | JobPortal</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <div class="brand">Job<span>Portal</span></div>

      <h1 style="margin-top: 28px">Create your account</h1>
      <p class="muted">Join as a candidate or employer and start moving forward.</p>

      <div id="notice" hidden></div>

      <form id="registerForm">
        <label class="label" for="username">Username</label>
        <input
          class="input"
          id="username"
          type="text"
          minlength="3"
          required
          autocomplete="username"
        >

        <label class="label" for="email">Email</label>
        <input
          class="input"
          id="email"
          type="email"
          required
          autocomplete="email"
        >

        <label class="label" for="password">Password</label>
        <input
          class="input"
          id="password"
          type="password"
          minlength="8"
          required
          autocomplete="new-password"
        >

        <label class="label" for="role">Account type</label>
        <select class="select" id="role" required>
          <option value="JOB_SEEKER">Job seeker</option>
          <option value="EMPLOYER">Employer</option>
        </select>

        <button class="btn wide" type="submit">Create account</button>
      </form>

      <p class="muted" style="text-align: center; margin-top: 22px">
        Already registered? <a href="/login.html">Sign in</a>
      </p>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    const registerFormElement = document.getElementById('registerForm');
    const usernameInput = document.getElementById('username');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const roleSelect = document.getElementById('role');

    registerFormElement.addEventListener('submit', async (event) => {
      event.preventDefault();

      try {
        await api('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            email: emailInput.value.trim(),
            password: passwordInput.value,
            role: roleSelect.value
          })
        });

        showNotice(
          'notice',
          'Registration successful. You can now sign in.',
          'success'
        );

        setTimeout(() => {
          window.location.href = '/login.html';
        }, 900);
      } catch (error) {
        showNotice('notice', error.message, 'error');
      }
    });
  </script>
</body>
</html>
