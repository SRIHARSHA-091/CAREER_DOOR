<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | JobPortal</title><link rel="stylesheet" href="/css/app.css"></head><body><main class="auth-shell"><section class="card auth-card"><div class="brand">Job<span>Portal</span></div><h1 style="margin-top:28px">Welcome back</h1><p class="muted">Sign in to discover opportunities or manage your hiring pipeline.</p><div id="notice" hidden></div><form id="loginForm"><label class="label" for="email">Email</label><input class="input" id="email" type="email" required autocomplete="email"><label class="label" for="password">Password</label><input class="input" id="password" type="password" required autocomplete="current-password"><button class="btn wide" type="submit">Sign in</button></form><p class="muted" style="text-align:center;margin-top:22px">New here? <a href="/register.html">Create an account</a></p></section></main><script src="/js/app.js"></script><script>loginForm.addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value.trim(),password:password.value})});localStorage.setItem('accessToken',d.accessToken||d.token);if(d.refreshToken)localStorage.setItem('refreshToken',d.refreshToken);if(d.username)localStorage.setItem('username',d.username);if(d.role)localStorage.setItem('role',String(d.role).replace('ROLE_',''));location.href='/dashboard.html'}catch(err){showNotice('notice',err.message,'error')}})</script></body></html>
