<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | JobPortal</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><div class="topbar-inner"><div class="brand">Job<span>Portal</span></div><div class="actions"><span id="roleLabel" class="pill"></span><button class="btn ghost" id="logoutBtn">Log out</button></div></div></header><main class="shell"><section class="hero"><h1 id="welcome">Welcome</h1><p>Find the right next step, or build your team with confidence.</p></section><div class="actions" style="justify-content:space-between;margin-bottom:16px"><div><h2 style="margin-bottom:4px">Open opportunities</h2><span class="muted">Fresh roles from verified employers</span></div><button id="postBtn" class="btn" hidden>Post a job</button></div><div id="notice" hidden></div><section id="jobs" class="grid"><div class="card job-card muted">Loading jobs…</div></section></main><div id="modalBackdrop" class="modal-backdrop"><section class="card modal"><div class="actions" style="justify-content:space-between"><h2>Publish a job</h2><button class="btn ghost" id="closeBtn" type="button">Close</button></div><div id="postNotice" hidden></div><form id="jobForm"><div class="row"><div><label class="label" for="title">Title</label><input class="input" id="title" required></div><div><label class="label" for="location">Location</label><input class="input" id="location" required></div></div><div class="row"><div><label class="label" for="company">Company</label><input class="input" id="company" required></div><div><label class="label" for="salary">Salary</label><input class="input" id="salary" type="number" min="0" step="0.01"></div></div><label class="label" for="description">Description</label><textarea class="textarea" id="description" required></textarea><button class="btn wide" type="submit">Publish job</button></form></section></div><script src="/js/app.js"></script><script>if(!requireAuth()){}else{const currentRole=role();roleLabel.textContent=currentRole.replace('_',' ');welcome.textContent=`Welcome, ${localStorage.getItem('username')||'there'}!`;postBtn.hidden=currentRole!=='EMPLOYER';logoutBtn.onclick=logout;postBtn.onclick=()=>modalBackdrop.classList.add('open');closeBtn.onclick=()=>modalBackdrop.classList.remove('open');async function loadJobs(){try{const d=await api('/jobs?page=0&size=50&sortBy=createdAt&direction=desc');const list=Array.isArray(d)?d:(d?.content||[]);jobs.innerHTML=list.length?list.map(j=>`<article class="card job-card"><h3>${escapeHtml(j.title||'Untitled role')}</h3><div class="muted">${escapeHtml(j.company||'Employer')}</div><div class="job-meta"><span class="pill">${escapeHtml(j.location||'Flexible')}</span>${j.salary?`<span class="pill">${escapeHtml(j.salary)}</span>`:''}<span>${j.createdAt?new Date(j.createdAt).toLocaleDateString():''}</span></div><p>${escapeHtml(j.description||'No description provided.')}</p>${currentRole==='JOB_SEEKER'?`<button class="btn secondary" onclick="apply(${j.id})">Apply now</button>`:''}</article>`).join(''):'<div class="card job-card muted">No open jobs are available yet.</div>'}catch(e){showNotice('notice',e.message,'error')}}window.apply=async id=>{try{await api('/applications/apply',{method:'POST',body:JSON.stringify({jobId:id})});showNotice('notice','Application submitted successfully.','success')}catch(e){showNotice('notice',e.message,'error')}};jobForm.addEventListener('submit',async e=>{e.preventDefault();try{await api('/jobs/post',{method:'POST',body:JSON.stringify({title:title.value.trim(),company:company.value.trim(),description:description.value.trim(),location:location.value.trim(),salary:salary.value?Number(salary.value):null})});modalBackdrop.classList.remove('open');jobForm.reset();showNotice('notice','Job published successfully.','success');loadJobs()}catch(e){showNotice('postNotice',e.message,'error')}});loadJobs()}</script></body></html>
